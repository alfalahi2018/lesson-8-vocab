<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventure Park Words</title>
<style>
:root{--g:#0f6b4a;--g2:#d9f5e6;--y:#ffc83d;--b:#1b4fa8;--bg:#e9f7ff;--ink:#12324a;--r:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow-x:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:'Baloo 2','Fredoka','Nunito',ui-rounded,'Trebuchet MS','Segoe UI',Tahoma,sans-serif;color:var(--ink);
background:linear-gradient(#8fd3ff 0,#dff3ff 45%,#f7e6bd 100%) fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sun{position:fixed;top:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(#fff6b0,#ffd54a 60%,transparent 70%);opacity:.9;pointer-events:none}
.mtn{position:fixed;bottom:0;left:0;right:0;height:120px;pointer-events:none;opacity:.35;background:
linear-gradient(135deg,transparent 48%,#b07a45 49%) 0 100%/220px 110px repeat-x,linear-gradient(225deg,transparent 48%,#8d5f33 49%) 110px 100%/220px 90px repeat-x}
#app{position:relative;max-width:980px;margin:0 auto;padding:10px 14px 70px}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border:3px solid var(--g);border-radius:18px;padding:6px 14px;margin-bottom:12px;font-weight:800;box-shadow:0 4px 0 rgba(15,107,74,.25)}
.bar button{font:inherit}
.pill{background:var(--g2);border-radius:14px;padding:2px 12px}
h1{margin:6px 0 2px;font-size:clamp(28px,6vw,52px);color:var(--g);text-align:center;line-height:1.1}
.sub{text-align:center;font-size:clamp(16px,3vw,22px);margin-bottom:14px}
.en{direction:ltr;unicode-bidi:isolate}
.btn{font:inherit;font-weight:800;border:0;border-radius:18px;padding:12px 22px;font-size:clamp(18px,3vw,24px);cursor:pointer;color:#fff;background:var(--g);box-shadow:0 5px 0 #09452f;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #09452f}
.btn.y{background:var(--y);color:#5a3b00;box-shadow:0 5px 0 #c08a00}
.btn.b{background:var(--b);box-shadow:0 5px 0 #0f2f6e}
.btn[disabled]{opacity:.4}
.menu{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:8px}
.stage{background:#fff;border:4px solid var(--y);border-radius:24px;padding:16px;text-align:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.stage:active{transform:scale(.98)}
.stage .ic{font-size:54px}
.stage h3{margin:4px 0;font-size:26px;color:var(--g)}
.stage p{margin:0;font-size:18px}
.stage.done{border-color:#2fb36a;background:#f0fff6}
.thumbs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:78px;height:62px;object-fit:cover;object-position:50% 80%;border-radius:12px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.card{background:#fff;border:4px solid var(--g);border-radius:26px;padding:12px;text-align:center;box-shadow:0 6px 0 rgba(15,107,74,.25)}
.card .pic{width:100%;max-height:52vh;object-fit:contain;border-radius:18px;background:#eef}
.word{font-size:clamp(34px,8vw,64px);font-weight:800;color:var(--g);line-height:1.1;margin-top:8px}
.ph{font-size:clamp(20px,4vw,30px);color:var(--b);font-weight:700}
.syl{font-size:clamp(18px,3.5vw,26px);letter-spacing:2px;color:#7a4a00;font-weight:800}
.ar{font-size:clamp(22px,4.5vw,32px);font-weight:800;color:#8a1f5c;margin:4px 0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:10px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:#bcd;display:inline-block}
.dots i.on{background:var(--y);transform:scale(1.25)}.dots i.seen{background:var(--g)}
.q{background:#fff;border:4px solid var(--b);border-radius:24px;padding:14px;text-align:center}
.q .ask{font-size:clamp(20px,4vw,28px);font-weight:800;margin:4px 0 10px}
.defn{font-size:clamp(22px,4.6vw,34px);font-weight:700;background:#fffbe6;border:3px dashed var(--y);border-radius:18px;padding:14px;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{border:5px solid #cfe3f5;border-radius:20px;background:#fff;padding:0;overflow:hidden;cursor:pointer;font:inherit}
.opt .crop{aspect-ratio:1/.78;overflow:hidden}
.opt .crop img{width:100%;display:block;margin-top:-21%}
.opt.w{padding:16px 8px;font-size:clamp(22px,4.6vw,34px);font-weight:800;color:var(--b)}
.opt.ok{border-color:#2fb36a;background:#e6ffef;animation:pop .4s}
.opt.no{border-color:var(--r);background:#ffe8e8;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{font-size:80px;line-height:1}
.stars{font-size:54px;letter-spacing:6px}
.foot{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));font-weight:800;font-size:15px;color:#fff;background:rgba(15,107,74,.92);z-index:6;direction:ltr}
.cf{position:fixed;top:-20px;z-index:20;pointer-events:none;animation:fall 2.4s linear forwards;font-size:26px}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.hint{font-size:16px;opacity:.8;margin-top:6px}
</style>
</head>

 '<div class="stage'+(done.learn?' done':'')+'" onclick="learn(0)"><div class="ic">📖</div><h3>1) Meet the Words</h3><p>Picture + pronunciation + meaning '+(done.learn?'✅':'')+'</p></div>'+
 '<div class="stage'+(done.listen?' done':'')+'" onclick="quiz(\'listen\')"><div class="ic">🎧</div><h3>2) Listen and Pick</h3><p>Which picture matches the word? '+(done.listen?'✅':'')+'</p></div>'+
 '<div class="stage'+(done.mean?' done':'')+'" onclick="quiz(\'mean\')"><div class="ic">💡</div><h3>3) Meaning Match</h3><p>Read the meaning and pick the word '+(done.mean?'✅':'')+'</p></div></div>'+
 '<div class="hint" style="text-align:center">Start with Stage 1, then choose any stage you like 😊</div>'+(all?'<div class="row"><button class="btn b" onclick="confetti(40)">🎉 You are an Adventure Champion!</button></div>':'');
}
function learn(k){
 var w=W[k];seen[k]=1;
 var dots=W.map(function(_,j){return '<i class="'+(j==k?'on':seen[j]?'seen':'')+'"></i>'}).join('');
 app.innerHTML=bar(true)+'<div class="card"><img class="pic" src="'+IMG[w.i]+'" alt="'+w.en+'">'+
 '<div class="word en">'+w.en+'</div><div class="ph en">'+w.ph+'</div><div class="syl en">'+w.syl+'</div>'+
 '<div class="row"><button class="btn b" onclick="say(W['+k+'].en,.85)">🔊 Listen</button><button class="btn y" onclick="say(W['+k+'].en,.5)">🐢 Slowly</button></div></div>'+
 '<div class="dots">'+dots+'</div>'+
 '<div class="row"><button class="btn" '+(k==0?'disabled':'')+' onclick="learn('+(k-1)+')">⬅️ Back</button>'+
 (k<5?'<button class="btn" onclick="learn('+(k+1)+')">Next ➡️</button>':'<button class="btn y" onclick="finishLearn()">I finished learning ✅</button>')+'</div>';
 setTimeout(function(){say(w.en,.85)},150);
}
function finishLearn(){done.learn=true;score+=10;confetti(30);home()}
function quiz(mode){
 var qs=sh(W),n=0,pts=0;
 function show(){
  var w=qs[n],o=sh([w].concat(sh(W.filter(function(x){return x!==w})).slice(0,3)));
  var head=bar(true)+'<div class="q"><div class="hint" style="margin:0 0 4px">Question '+(n+1)+' of 6</div>';
  if(mode=='listen'){
   head+='<div class="ask">Listen to the word, then pick the correct picture</div><div class="row"><button class="btn b" onclick="say(\''+w.en+'\',.85)">🔊 Listen</button><button class="btn y" onclick="say(\''+w.en+'\',.5)">🐢 Slowly</button></div><div class="opts">'+
   o.map(function(x){return '<button class="opt" data-w="'+x.i+'"><div class="crop"><img src="'+IMG[x.i]+'" alt=""></div></button>'}).join('')+'</div>';
   setTimeout(function(){say(w.en,.85)},300);
  }else{
   head+='<div class="ask">Which word matches this meaning?</div><div class="defn en">'+w.m+'</div><div class="opts">'+
   o.map(function(x){return '<button class="opt w en" data-w="'+x.i+'">'+x.en+'</button>'}).join('')+'</div>';
  }
  app.innerHTML=head+'</div>';
  var tried=false,locked=false;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
   if(locked||b.classList.contains('no'))return;
   if(+b.dataset.w==w.i){locked=true;b.classList.add('ok');if(!tried){pts++;score+=10}say(w.en,.85);confetti(10);
    setTimeout(function(){n++;n<6?show():end()},1500)}
   else{tried=true;b.classList.add('no')}}});
 }
 function end(){done[mode]=true;var s=pts>=6?3:pts>=4?2:1;
  app.innerHTML=bar(true)+'<div class="q"><div class="big">'+(s==3?'🏆':'🌟')+'</div><h1>'+(s==3?'Well done, champion!':s==2?'Great job!':'Nice try!')+'</h1>'+
  '<div class="stars">'+'⭐'.repeat(s)+'</div><div class="ask">You got '+pts+' out of 6 on the first try</div>'+
  '<div class="row"><button class="btn b" onclick="quiz(\''+mode+'\')">🔁 Play again</button><button class="btn" onclick="home()">🏠 Menu</button></div></div>';
  confetti(s*14);}
 show();
}
home();
</script>
</body>
</html>
